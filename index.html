<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nos Arcs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  color-scheme: light dark;
  --bg:#e9edf5; --bg-glow:#dfe4f0;
  --panel:#ffffff; --panel-2:#f3f6fc; --panel-3:#e9eef8;
  --ink:#161c2b; --muted:#5c6580; --faint:#8b93a8;
  --line:rgba(20,28,48,.10); --line-2:rgba(20,28,48,.16);
  --amber:#b26a05; --amber-tint:rgba(216,140,18,.13); --amber-edge:rgba(216,140,18,.40);
  --mint:#137e53; --mint-tint:rgba(23,140,90,.12); --mint-edge:rgba(23,140,90,.34);
  --peri:#4b52c9; --peri-tint:rgba(91,98,214,.12); --peri-edge:rgba(91,98,214,.34);
  --shadow:0 1px 2px rgba(20,28,48,.05), 0 12px 30px -18px rgba(20,28,48,.35);
  --shadow-hero:0 2px 4px rgba(160,100,10,.08), 0 26px 50px -26px rgba(150,95,10,.45);
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1120; --bg-glow:#141a2c;
    --panel:#181f30; --panel-2:#1f2740; --panel-3:#232c46;
    --ink:#e8edf8; --muted:#94a0bb; --faint:#6f7b96;
    --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
    --amber:#ffb454; --amber-tint:rgba(255,180,84,.12); --amber-edge:rgba(255,180,84,.34);
    --mint:#5fd3a3; --mint-tint:rgba(95,211,163,.11); --mint-edge:rgba(95,211,163,.30);
    --peri:#8b93f0; --peri-tint:rgba(139,147,240,.13); --peri-edge:rgba(139,147,240,.32);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 40px -22px rgba(0,0,0,.7);
    --shadow-hero:0 2px 4px rgba(0,0,0,.35), 0 30px 60px -28px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1120; --bg-glow:#141a2c;
  --panel:#181f30; --panel-2:#1f2740; --panel-3:#232c46;
  --ink:#e8edf8; --muted:#94a0bb; --faint:#6f7b96;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
  --amber:#ffb454; --amber-tint:rgba(255,180,84,.12); --amber-edge:rgba(255,180,84,.34);
  --mint:#5fd3a3; --mint-tint:rgba(95,211,163,.11); --mint-edge:rgba(95,211,163,.30);
  --peri:#8b93f0; --peri-tint:rgba(139,147,240,.13); --peri-edge:rgba(139,147,240,.32);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 40px -22px rgba(0,0,0,.7);
  --shadow-hero:0 2px 4px rgba(0,0,0,.35), 0 30px 60px -28px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background-image: radial-gradient(120% 60% at 82% -8%, var(--bg-glow), transparent 60%);
  background-attachment: fixed;
}
.wrap{ max-width: 860px; margin:0 auto; padding: 22px 20px 96px; }

/* ---------- header ---------- */
header.top{ padding: 14px 0 8px; }
.brandrow{ display:flex; align-items:center; gap:12px; }
.mark{ flex:0 0 auto; width:38px; height:38px; color:var(--amber); }
.brandtext .title{
  font-family:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  font-weight:700; font-size: clamp(30px, 7vw, 44px); line-height:1.0; letter-spacing:-0.02em; margin:0;
}
.subtitle{
  margin:6px 2px 0; color:var(--muted); font-size:15px; max-width:60ch;
  border-radius:6px; padding:2px 5px; margin-left:-5px; outline:none; transition:background .15s;
  cursor:text;
}
.subtitle:hover{ background:var(--panel-2); }
.subtitle:focus{ background:var(--panel-2); box-shadow:0 0 0 2px var(--peri-edge); }
.subtitle[data-empty]:before{ content:"Un nom pour votre duo…"; color:var(--faint); }

.statbar{ display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:18px; padding-bottom:2px; align-items:baseline; }
.stat{ display:flex; align-items:baseline; gap:7px; }
.stat b{ font-family:"Space Grotesk"; font-weight:600; font-size:19px; }
.stat span{ color:var(--muted); font-size:13.5px; }
.stat .dot{ width:7px; height:7px; border-radius:50%; align-self:center; }
.dot.a{ background:var(--amber);} .dot.m{ background:var(--mint);} .dot.p{ background:var(--peri);}

/* ---------- sections ---------- */
section{ margin-top:34px; }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 14px; }
.sec-head h2{
  font-family:"Space Grotesk"; font-weight:600; font-size:15px; letter-spacing:.01em; margin:0;
  color:var(--ink);
}
.sec-head .count{ color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums; }

/* ---------- hero (arc en cours) ---------- */
.hero{
  position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:22px 22px 20px; box-shadow:var(--shadow-hero);
  overflow:hidden;
}
.hero:before{ content:""; position:absolute; inset:0; background:var(--amber-tint); pointer-events:none; }
.hero > *{ position:relative; }
.hero .live{ display:inline-flex; align-items:center; gap:8px; color:var(--amber); font-weight:600; font-size:12.5px; letter-spacing:.04em; }
.pulse{ width:9px; height:9px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 0 var(--amber-edge); animation:pulse 2.4s infinite; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 var(--amber-edge)} 70%{box-shadow:0 0 0 9px transparent} 100%{box-shadow:0 0 0 0 transparent} }
.hero h3{ font-family:"Space Grotesk"; font-weight:700; font-size: clamp(24px,5.5vw,32px); letter-spacing:-.02em; margin:10px 0 12px; }
.hero .chips{ margin-bottom:18px; }
.hero .actions{ display:flex; flex-wrap:wrap; gap:10px; }
.hero-grid{ display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center; }
.hero-main{ min-width:0; }

/* ---------- covers (images Steam) ---------- */
.cover{
  position:relative; flex:0 0 auto; overflow:hidden; aspect-ratio:460/215;
  background:linear-gradient(135deg,var(--panel-3),var(--panel-2)); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-family:"Space Grotesk"; font-weight:700; color:var(--faint); letter-spacing:-.02em;
}
.cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.cover.h{ width:280px; border-radius:12px; font-size:44px; box-shadow:var(--shadow); }
.cover.q{ width:112px; border-radius:8px; font-size:20px; }
.cover.d{ width:92px; border-radius:7px; font-size:17px; }
.cover.r{ width:calc(100% + 30px); margin:-15px -15px 12px; border:none; border-bottom:1px solid var(--line); border-radius:0; font-size:34px; }

.empty-hero{
  border:1px dashed var(--line-2); border-radius:var(--r-lg); padding:26px 22px; text-align:left; color:var(--muted); background:var(--panel-2);
}
.empty-hero strong{ color:var(--ink); font-family:"Space Grotesk"; font-weight:600; display:block; font-size:17px; margin-bottom:4px; }

/* ---------- queue ---------- */
.queue{ display:flex; flex-direction:column; gap:2px; }
.qrow{
  display:grid; grid-template-columns:auto auto 1fr auto; align-items:center; gap:14px;
  padding:14px 8px 14px 6px; border-bottom:1px solid var(--line);
}
.qrow:first-child{ border-top:1px solid var(--line); }
.qnum{ font-family:"Space Grotesk"; font-weight:600; color:var(--peri); font-size:15px; width:22px; text-align:center; font-variant-numeric:tabular-nums; }
.qbody .name{ font-weight:600; font-size:16.5px; letter-spacing:-.01em; }
.qbody .chips{ margin-top:5px; }
.qtools{ display:flex; align-items:center; gap:4px; }

/* ---------- recommendations ---------- */
.recogrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(232px,1fr)); gap:12px; }
.reco{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md); padding:15px 15px 14px; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:var(--shadow);
}
.reco .name{ font-family:"Space Grotesk"; font-weight:600; font-size:16px; letter-spacing:-.01em; }
.reco .blurb{ color:var(--muted); font-size:13.5px; line-height:1.45; margin:7px 0 11px; }
.reco .why{ font-size:12px; color:var(--faint); margin-bottom:10px; }
.reco .why b{ color:var(--peri); font-weight:600; }
.reco .whytags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.reco .foot{ margin-top:auto; display:flex; gap:8px; align-items:center; }
.reco .foot .sm-spacer{ flex:1 1 auto; display:block; }
.sec-head .count .linkbtn{ font-size:13px; color:var(--peri); font-weight:600; }
.reco-hidden{ margin-top:12px; color:var(--faint); font-size:12.5px; }
.reco-hidden .linkbtn{ color:var(--peri); }

/* ---------- done timeline ---------- */
.tl{ position:relative; margin-left:6px; padding-left:24px; }
.tl:before{ content:""; position:absolute; left:4px; top:6px; bottom:6px; width:2px; background:var(--line); }
.done-item{ position:relative; padding:4px 0 20px; }
.done-item:before{ content:""; position:absolute; left:-24px; top:8px; width:11px; height:11px; border-radius:50%; background:var(--panel); border:2px solid var(--mint); box-shadow:0 0 0 4px var(--bg); }
.done-item .rowtop{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.done-item .dhead{ display:flex; align-items:center; gap:12px; min-width:0; }
.done-item .name{ font-family:"Space Grotesk"; font-weight:600; font-size:17px; letter-spacing:-.01em; }
.done-item .date{ color:var(--faint); font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.stars{ display:inline-flex; gap:2px; margin-top:7px; }
.star{ cursor:pointer; color:var(--line-2); width:19px; height:19px; display:inline-flex; transition:transform .1s, color .12s; }
.star.on{ color:var(--amber); }
.star:hover{ transform:scale(1.14); }
.note{ margin-top:9px; }
.note p{ margin:0; color:var(--muted); font-size:14px; white-space:pre-wrap; }
.note .add-note{ font-size:13px; color:var(--peri); cursor:pointer; }
.note textarea{
  width:100%; margin-top:4px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line-2);
  border-radius:var(--r-sm); padding:9px 11px; font:inherit; font-size:14px; resize:vertical; min-height:64px; outline:none;
}
.note textarea:focus{ box-shadow:0 0 0 2px var(--peri-edge); border-color:transparent; }
.done-tools{ margin-top:8px; display:flex; gap:14px; }
.linkbtn{ background:none; border:none; padding:0; font:inherit; font-size:12.5px; color:var(--faint); cursor:pointer; }
.linkbtn:hover{ color:var(--ink); }
.linkbtn.danger:hover{ color:#e0574f; }

/* ---------- chips ---------- */
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  font-size:11.5px; font-weight:500; color:var(--muted); background:var(--panel-2);
  border:1px solid var(--line); border-radius:var(--r-pill); padding:3px 10px; white-space:nowrap;
}
.chip.match{ color:var(--peri); background:var(--peri-tint); border-color:var(--peri-edge); }

/* ---------- buttons ---------- */
.btn{
  font:inherit; font-weight:600; font-size:14px; cursor:pointer; border-radius:var(--r-sm);
  padding:10px 15px; border:1px solid var(--line-2); background:var(--panel-2); color:var(--ink);
  display:inline-flex; align-items:center; gap:8px; transition:background .14s, border-color .14s, transform .05s;
}
.btn:hover{ background:var(--panel-3); }
.btn:active{ transform:translateY(1px); }
.btn svg{ width:16px; height:16px; }
.btn.primary{ background:var(--amber); border-color:transparent; color:#20160a; }
.btn.primary:hover{ filter:brightness(1.05); background:var(--amber); }
.btn.ghost{ background:transparent; }
.btn.sm{ padding:7px 11px; font-size:13px; border-radius:8px; }
.iconbtn{
  width:34px; height:34px; padding:0; display:inline-flex; align-items:center; justify-content:center;
  border-radius:9px; border:1px solid transparent; background:transparent; color:var(--faint); cursor:pointer;
  transition:background .14s, color .14s;
}
.iconbtn:hover{ background:var(--panel-2); color:var(--ink); }
.iconbtn:disabled{ opacity:.32; cursor:default; }
.iconbtn svg{ width:17px; height:17px; }

/* ---------- add form ---------- */
.addbar{ margin-top:14px; }
.addcard{ margin-top:12px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md); padding:16px; box-shadow:var(--shadow); }
.addcard input.name, .addcard input.steam{
  width:100%; background:var(--panel-2); color:var(--ink); border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:11px 13px; font:inherit; font-size:15.5px; outline:none;
}
.addcard input.steam{ font-size:14px; padding:9px 12px; }
.addcard input.name:focus, .addcard input.steam:focus{ box-shadow:0 0 0 2px var(--peri-edge); border-color:transparent; }
.addcard .lbl{ font-size:12.5px; color:var(--muted); margin:14px 2px 8px; }
.tagpick{ display:flex; flex-wrap:wrap; gap:7px; }
.tagopt{
  font-size:12.5px; font-weight:500; color:var(--muted); background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--r-pill); padding:5px 11px; cursor:pointer; user-select:none; transition:all .12s;
}
.tagopt[aria-pressed="true"]{ color:var(--peri); background:var(--peri-tint); border-color:var(--peri-edge); }
.addcard .formfoot{ display:flex; gap:10px; margin-top:16px; }

/* ---------- states ---------- */
.state{ text-align:center; padding:60px 20px; color:var(--muted); }
.state .sp{ width:26px; height:26px; border:2.5px solid var(--line-2); border-top-color:var(--amber); border-radius:50%; margin:0 auto 16px; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg) } }
.state h3{ font-family:"Space Grotesk"; color:var(--ink); font-weight:600; margin:0 0 6px; }
.emptyline{ color:var(--faint); font-size:14px; padding:10px 2px; }

/* toast */
#toast{
  position:fixed; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg);
  padding:11px 18px; border-radius:var(--r-pill); font-size:14px; font-weight:500; pointer-events:none;
  transition:opacity .22s, transform .22s; z-index:50; max-width:88vw; box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* save bar */
#savebar{ position:fixed; left:0; right:0; bottom:0; z-index:40; pointer-events:none;
  transform:translateY(150%); transition:transform .26s cubic-bezier(.2,.7,.3,1);
  padding:0 14px calc(14px + env(safe-area-inset-bottom,0px)); }
#savebar.show{ transform:none; }
.savebar-in{ pointer-events:auto; max-width:860px; margin:0 auto; background:var(--panel);
  border:1px solid var(--line-2); border-radius:15px; box-shadow:0 14px 36px -12px rgba(0,0,0,.55);
  padding:11px 13px 11px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.savebar-txt{ font-weight:600; font-size:14px; display:flex; align-items:center; gap:10px; }
.savebar-txt:before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 4px var(--amber-tint); flex:0 0 auto; }
.savebar-btns{ display:flex; gap:8px; flex:0 0 auto; }

/* save modal */
#savemodal, #ghmodal, #covermodal{ position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; }
#savemodal[hidden], #ghmodal[hidden], #covermodal[hidden]{ display:none; }
.cover.editable{ cursor:pointer; }
.cover.editable:after{
  content:"✎"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(6,9,16,.55); color:#fff; font-size:18px; opacity:0; transition:opacity .15s;
}
.cover.editable:hover:after, .cover.editable:focus-visible:after{ opacity:1; }
.cv-preview{ margin:0 0 14px; }
.cv-preview .cover{ width:100%; border-radius:12px; font-size:48px; }
.cv-drop{ margin-top:12px; border:1.5px dashed var(--line-2); border-radius:12px; padding:14px; text-align:center; color:var(--muted); font-size:13.5px; }
.cv-drop.over{ border-color:var(--peri); background:var(--peri-tint); }
.cv-drop label{ color:var(--peri); font-weight:600; cursor:pointer; }
.cv-drop input{ display:none; }
#savebar[data-state="saved"] .savebar-txt:before{ background:var(--mint); box-shadow:0 0 0 4px var(--mint-tint); }
#savebar[data-state="error"] .savebar-txt:before{ background:#e0574f; box-shadow:0 0 0 4px rgba(224,87,79,.15); }
.gh-steps{ margin:0 0 14px; padding-left:20px; color:var(--muted); font-size:13.5px; line-height:1.7; }
.gh-steps a{ color:var(--peri); }
.gh-steps code, .gh-note code{ background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:12.5px; }
.gh-input{ width:100%; background:var(--panel-2); color:var(--ink); border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:10px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; outline:none; }
.gh-input:focus{ box-shadow:0 0 0 2px var(--peri-edge); border-color:transparent; }
.gh-note{ color:var(--faint); font-size:12.5px; margin:8px 0 0; }
footer.foot .linkbtn{ color:var(--peri); font-size:12.5px; }
.sm-backdrop{ position:absolute; inset:0; background:rgba(6,9,16,.55); }
.sm-card{ position:relative; width:100%; max-width:600px; max-height:88vh; overflow:auto;
  background:var(--panel); border:1px solid var(--line-2); border-radius:18px;
  box-shadow:0 34px 80px -26px rgba(0,0,0,.75); padding:20px; }
.sm-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.sm-head h3{ font-family:"Space Grotesk"; font-weight:700; font-size:19px; margin:0; letter-spacing:-.01em; }
.sm-intro{ color:var(--muted); font-size:13.5px; line-height:1.55; margin:10px 0 13px; }
.sm-intro code{ background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:12.5px; }
.sm-tabs{ display:flex; gap:6px; margin-bottom:10px; }
.sm-tab{ font:inherit; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--line);
  background:var(--panel-2); color:var(--muted); border-radius:999px; padding:6px 13px; }
.sm-tab.active{ color:var(--peri); background:var(--peri-tint); border-color:var(--peri-edge); }
#save-text{ width:100%; height:220px; resize:vertical; background:var(--panel-2); color:var(--ink);
  border:1px solid var(--line-2); border-radius:12px; padding:12px 13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.5; outline:none; white-space:pre; }
#save-text:focus{ box-shadow:0 0 0 2px var(--peri-edge); border-color:transparent; }
.sm-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px; }
.sm-spacer{ flex:1 1 auto; }
@media (max-width:560px){ .sm-spacer{ display:none; width:100%; } .sm-actions{ gap:8px; } }

footer.foot{ margin-top:48px; padding-top:18px; border-top:1px solid var(--line); color:var(--faint); font-size:12.5px; text-align:center; }

@media (max-width:560px){
  .wrap{ padding:18px 15px 90px; }
  .hero .actions{ flex-direction:column; align-items:stretch; }
  .hero .actions .btn{ justify-content:center; }
  .recogrid{ grid-template-columns:1fr; }
  .hero-grid{ grid-template-columns:1fr; }
  .cover.h{ width:100%; order:-1; }
  .qrow{ gap:10px; }
  .cover.q{ width:76px; font-size:16px; }
  .cover.d{ width:72px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M6 30c0-9 6.3-16 14-16s14 7 14 16" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".95"/>

  // ---------- Steam : appid connus -> image header.jpg ----------
  var STEAM_IDS = {
    "Satisfactory":526870, "Valheim":892970, "Scrap Mechanic":387990, "Albion Online":761890,
    "Factorio":427520, "Dyson Sphere Program":1366540, "Foundry":983870, "Techtonica":1457320,
    "Captain of Industry":1594320, "Grounded":962130, "Raft":648800, "Green Hell":815370,
    "Enshrouded":1203620, "Palworld":1623730, "V Rising":1604030, "Core Keeper":1621690,
    "Deep Rock Galactic":548430, "Terraria":105600, "Astroneer":361420, "Space Engineers":244850,
    "Trailmakers":585420, "No Man's Sky":275850, "7 Days to Die":251570, "Sons of the Forest":1326470,
    "Icarus":1149460, "Abiotic Factor":427410, "Necesse":1169040, "Barotrauma":602960,
    "Stardew Valley":413150, "Don't Starve Together":322330, "Nightingale":1928980,
    "Empyrion":383120, "Eco":382310
  };
  var STEAM_BY_NORM = {};
  for(var sk in STEAM_IDS){ STEAM_BY_NORM[String(sk).toLowerCase().replace(/[^a-z0-9]/g,"")] = STEAM_IDS[sk]; }
  var BAD_IMG = {};      // src d'images en échec → lettre de repli
  var LOCAL_COVER = {};  // images tout juste envoyées : aperçu local en attendant GitHub

  // ---------- state ----------
  var S = {
    phase:"loading",           // loading | ready | error
    games:[], meta:null, dirty:false,
    ui:{ addOpen:false, addName:"", addSteam:"", addTags:{}, noteFor:null, confirmDel:null, saveView:"json", recoPage:0 }
  };

  var boardEl = document.getElementById("board");
  var statEl = document.getElementById("statbar");
  var subEl = document.getElementById("subtitle");
  var toastEl = document.getElementById("toast");
  var toastT = null;

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function byId(id){
    for(var i=0;i<S.games.length;i++){ if(S.games[i].id===id) return S.games[i]; }
    return null;
  }
  function list(){ return S.games.slice(); }
  function markDirty(){ S.dirty=true; renderSaveBar(); scheduleSync(); }
  function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
  function now(){ return new Date().toISOString(); }

  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add("show");
    if(toastT) clearTimeout(toastT);
    toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
  }

  function chipsHtml(tags, matchSet){
    if(!tags||!tags.length) return "";
    var out = tags.map(function(t){
      var lbl = TAGS[t]||t; var m = matchSet && matchSet[t] ? " match":"";
      return '<span class="chip'+m+'">'+esc(lbl)+'</span>';
    }).join("");
    return '<div class="chips">'+out+'</div>';
  }

  function appIdFor(g){
    if(g && g.steamId) return g.steamId;
    return STEAM_BY_NORM[norm(g && g.name)] || null;
  }
  function parseSteamId(v){
    v=String(v||"").trim(); if(!v) return null;
    var m=v.match(/app\/(\d+)/) || v.match(/^(\d+)$/);
    return m ? parseInt(m[1],10) : null;
  }
  function coverUrl(id){ return "https://shared.steamstatic.com/store_item_assets/steam/apps/"+id+"/header.jpg"; }
  function isImgUrl(v){ return /^https?:\/\/\S+$/i.test(String(v||"").trim()) && !parseSteamId(v); }
  function coverSrc(g){
    if(g.image) return LOCAL_COVER[g.image] || g.image;
    var id=appIdFor(g);
    return id ? coverUrl(id) : null;
  }
  function coverHtml(g, size){
    var src=coverSrc(g);
    var letter=esc(String(g.name||"?").trim().charAt(0).toUpperCase());
    var img=(src && !BAD_IMG[src]) ? '<img src="'+esc(src)+'" alt="" loading="lazy" data-cover="1">' : '';
    if(g.id && size!=="r"){
      return '<span class="cover '+size+' editable" data-action="cover-edit" data-id="'+esc(g.id)+'" role="button" tabindex="0" title="Changer l\'image" aria-label="Changer l\'image de '+esc(g.name)+'">'+letter+img+'</span>';
    }
    return '<span class="cover '+size+'" aria-hidden="true">'+letter+img+'</span>';
  }
  function steamUrl(g){
    var id=appIdFor(g);
    return id ? "https://store.steampowered.com/app/"+id+"/" : "https://store.steampowered.com/search/?term="+encodeURIComponent(g.name);
  }

  function fmtDate(iso){
    if(!iso) return "";
    try{ var d=new Date(iso);
      return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}); }
    catch(e){ return ""; }
  }

  // ---------- icons ----------
  var IC = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 7 5.5Z"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',

    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 18.9 6.1 21.6l1.2-6.5L2.5 9.5l6.6-.9z"/></svg>'
  };

  // ---------- render ----------
  function render(){
    if(S.phase==="loading"){
      boardEl.innerHTML = '<div class="state"><div class="sp"></div>Chargement du carnet…</div>';
      return;
    }
    if(S.phase==="nodb"){
      boardEl.innerHTML = '<div class="state"><h3>Connecte-toi pour ouvrir le carnet</h3>'+
        '<p>Ce carnet est partagé et privé à votre organisation Claude. Ouvre ce lien en étant connecté à ton compte pour voir et modifier votre liste d\'arcs.</p></div>';
      statEl.innerHTML = "";
      return;
    }

    var playing = null, backlog = [], done = [];
    var GL = list();
    for(var i=0;i<GL.length;i++){
      var g=GL[i];
      if(g.status==="playing" && !playing) playing=g;
      else if(g.status==="done") done.push(g);
      else backlog.push(g);
    }
    backlog.sort(function(a,b){ return (a.order==null?1e9:a.order)-(b.order==null?1e9:b.order); });
    done.sort(function(a,b){ return String(b.finishedAt||"").localeCompare(String(a.finishedAt||"")); });

    // stats
    statEl.innerHTML =
      stat("m", done.length, done.length>1?"arcs bouclés":"arc bouclé") +
      stat("a", playing?1:0, "en cours") +
      stat("p", backlog.length, backlog.length>1?"à venir":"à venir");

    var html = "";

    // --- arc en cours ---
    html += '<section><div class="sec-head"><h2>Arc en cours</h2></div>';
    if(playing){
      html += '<div class="hero"><div class="hero-grid"><div class="hero-main">'+
        '<span class="live"><span class="pulse"></span>En train de jouer</span>'+
        '<h3>'+esc(playing.name)+'</h3>'+
        chipsHtml(playing.tags)+
        '<div class="actions">'+
          btn("primary","complete",playing.id,IC.check,"Marquer comme terminé")+
          iconWrap("remove",playing.id,IC.trash,"Retirer")+
        '</div>'+
      '</div>'+coverHtml(playing,"h")+'</div></div>';
    } else {
      html += '<div class="empty-hero"><strong>Aucun arc lancé.</strong>'+
        'Démarre un jeu depuis la file, ou pioche une recommandation plus bas.</div>';
    }
    html += '</section>';

    // --- la suite (backlog) ---
    html += '<section><div class="sec-head"><h2>La suite</h2><span class="count">'+backlog.length+'</span></div>';
    if(backlog.length){
      html += '<div class="queue">';
      for(var q=0;q<backlog.length;q++){
        var b=backlog[q];
        html += '<div class="qrow">'+
          '<div class="qnum">'+(q+1)+'</div>'+
          coverHtml(b,"q")+
          '<div class="qbody"><div class="name">'+esc(b.name)+'</div>'+chipsHtml(b.tags)+'</div>'+
          '<div class="qtools">'+
            iconWrap("start",b.id,IC.play,"Démarrer cet arc")+
            iconBtn("up",b.id,IC.up,"Monter",q===0)+
            iconBtn("down",b.id,IC.down,"Descendre",q===backlog.length-1)+
            delControl(b.id)+
          '</div>'+
        '</div>';
      }
      html += '</div>';
    } else {
      html += '<div class="emptyline">La file est vide. Ajoute un jeu ou pioche dans les recommandations.</div>';
    }
    // add bar / form
    if(S.ui.addOpen){
      html += renderAddForm();
    } else {
      html += '<div class="addbar">'+btn("ghost","toggle-add","",IC.plus,"Ajouter un jeu")+'</div>';
    }
    html += '</section>';

    // --- recommandations ---
    var allRecos = recommend();
    var hiddenN = hiddenRecos().length;
    if(allRecos.length || hiddenN){
      var pages = Math.max(1, Math.ceil(allRecos.length/RECO_N));
      var page = S.ui.recoPage % pages;
      var recos = allRecos.slice(page*RECO_N, page*RECO_N+RECO_N);
      html += '<section><div class="sec-head"><h2>Recommandé pour vous</h2>'+
        '<span class="count">'+(pages>1
          ? '<button class="linkbtn" data-action="reco-next">↻ Autres idées ('+(page+1)+'/'+pages+')</button>'
          : 'd\'après vos genres')+'</span></div>';
      if(!recos.length) html += '<div class="emptyline">Plus aucune idée dans le catalogue.</div>';
      html += '<div class="recogrid">';
      for(var r=0;r<recos.length;r++){
        var c=recos[r];
        var matchSet={}; c.shared.forEach(function(t){ matchSet[t]=1; });
        var whyLabels = c.shared.slice(0,3).map(function(t){ return TAGS[t]||t; });
        html += '<div class="reco">'+
          coverHtml(c,"r")+
          '<div class="name">'+esc(c.name)+'</div>'+
          '<div class="blurb">'+esc(c.blurb)+'</div>'+
          '<div class="why">Parce que vous aimez '+
            whyLabels.map(function(l){ return '<b>'+esc(l)+'</b>'; }).join(", ")+
          '</div>'+
          '<div class="foot">'+
            btnData("primary sm","add-reco",{n:c.name,t:c.tags.join(",")},IC.plus,"À la file")+
            '<a class="btn ghost sm" href="'+esc(steamUrl(c))+'" target="_blank" rel="noopener">Steam</a>'+
            '<span class="sm-spacer"></span>'+
            '<button class="iconbtn" data-action="reco-hide" data-n="'+esc(c.name)+'" title="Pas intéressé" aria-label="Pas intéressé">'+IC.x+'</button>'+
          '</div>'+
        '</div>';
      }
      html += '</div>';
      if(hiddenN){
        html += '<div class="reco-hidden">'+hiddenN+' idée'+(hiddenN>1?'s':'')+' masquée'+(hiddenN>1?'s':'')+' · '+
          '<button class="linkbtn" data-action="reco-unhide">Tout réafficher</button></div>';
      }
      html += '</section>';
    }

    // --- chapitres bouclés ---
    html += '<section><div class="sec-head"><h2>Chapitres bouclés</h2><span class="count">'+done.length+'</span></div>';
    if(done.length){
      html += '<div class="tl">';
      for(var d=0;d<done.length;d++){
        var g2=done[d]; html += renderDone(g2);
      }
      html += '</div>';
    } else {
      html += '<div class="emptyline">Aucun arc bouclé pour l\'instant. Votre premier chapitre commence maintenant.</div>';
    }
    html += '</section>';

    boardEl.innerHTML = html;
  }

  function stat(cls,n,label){
    return '<div class="stat"><span class="dot '+cls+'"></span><b>'+n+'</b><span>'+esc(label)+'</span></div>';
  }
  function btn(variant,action,id,icon,label){
    return '<button class="btn '+variant+'" data-action="'+action+'"'+(id?' data-id="'+id+'"':'')+'>'+icon+'<span>'+esc(label)+'</span></button>';
  }
  function btnData(variant,action,data,icon,label){
    var attrs=""; for(var k in data){ attrs+=' data-'+k+'="'+esc(data[k])+'"'; }
    return '<button class="btn '+variant+'" data-action="'+action+'"'+attrs+'>'+icon+'<span>'+esc(label)+'</span></button>';
  }
  function iconWrap(action,id,icon,label){ // accent icon button (start/remove in hero)
    return '<button class="iconbtn" data-action="'+action+'" data-id="'+id+'" title="'+esc(label)+'" aria-label="'+esc(label)+'">'+icon+'</button>';
  }
  function iconBtn(action,id,icon,label,disabled){
    return '<button class="iconbtn" data-action="'+action+'" data-id="'+id+'" title="'+esc(label)+'" aria-label="'+esc(label)+'"'+(disabled?' disabled':'')+'>'+icon+'</button>';
  }
  function delControl(id){
    if(S.ui.confirmDel===id){
      return '<button class="iconbtn" data-action="remove" data-id="'+id+'" title="Confirmer" style="color:#e0574f">'+IC.check+'</button>';
    }
    return '<button class="iconbtn" data-action="ask-del" data-id="'+id+'" title="Retirer" aria-label="Retirer">'+IC.trash+'</button>';
  }

  function renderDone(g){
    var stars = '<div class="stars" data-rate="'+g.id+'">';
    for(var s=1;s<=5;s++){
      stars += '<span class="star'+((g.rating||0)>=s?' on':'')+'" data-action="rate" data-id="'+g.id+'" data-val="'+s+'" role="button" aria-label="'+s+' sur 5">'+IC.star+'</span>';
    }
    stars += '</div>';

    var noteBlock;
    if(S.ui.noteFor===g.id){
      noteBlock = '<div class="note"><textarea data-action="note-input" data-id="'+g.id+'" placeholder="Un mot sur cet arc…">'+esc(g.notes||"")+'</textarea>'+
        '<div class="done-tools"><button class="linkbtn" data-action="note-save" data-id="'+g.id+'">Enregistrer</button>'+
        '<button class="linkbtn" data-action="note-cancel">Annuler</button></div></div>';
    } else if(g.notes){
      noteBlock = '<div class="note"><p data-action="edit-note" data-id="'+g.id+'" style="cursor:text">'+esc(g.notes)+'</p></div>';
    } else {
      noteBlock = '<div class="note"><span class="add-note" data-action="edit-note" data-id="'+g.id+'">+ Ajouter un mot</span></div>';
    }

    return '<div class="done-item">'+
      '<div class="rowtop"><span class="dhead">'+coverHtml(g,"d")+'<span class="name">'+esc(g.name)+'</span></span>'+
        (g.finishedAt?'<span class="date">'+esc(fmtDate(g.finishedAt))+'</span>':'')+'</div>'+
      chipsHtml(g.tags)+
      stars+
      noteBlock+
      '<div class="done-tools">'+
        '<button class="linkbtn" data-action="reopen" data-id="'+g.id+'">Rejouer</button>'+
        (S.ui.confirmDel===g.id
          ? '<button class="linkbtn danger" data-action="remove" data-id="'+g.id+'">Confirmer la suppression</button>'

  // ---------- recommendations ----------
  var RECO_N = 6;
  function hiddenRecos(){ return (S.meta && Array.isArray(S.meta.hiddenRecos)) ? S.meta.hiddenRecos : []; }
  function recommend(){
    var GL = list();
    if(!GL.length) return [];
    var owned = {}; GL.forEach(function(g){ owned[norm(g.name)]=1; });
    hiddenRecos().forEach(function(n){ owned[norm(n)]=1; });
    var w = { playing:3, done:2.6, backlog:1 };
    var tagScore = {};
    GL.forEach(function(g){
      var weight = w[g.status]||1;
      (g.tags||[]).forEach(function(t){ tagScore[t]=(tagScore[t]||0)+weight; });
    });
    var out = [];
    CATALOG.forEach(function(c){
      if(owned[norm(c.name)]) return;
      var score=0, shared=[];
      c.tags.forEach(function(t){ if(tagScore[t]){ score+=tagScore[t]; shared.push(t); } });
      if(score<=0) return;
      shared.sort(function(a,b){ return (tagScore[b]||0)-(tagScore[a]||0); });
      out.push({ name:c.name, blurb:c.blurb, tags:c.tags, score:score, shared:shared });
    });
    out.sort(function(a,b){ return b.score-a.score || a.name.localeCompare(b.name); });
    return out;
  }

    var m=0; list().forEach(function(g){ if(g.status==="backlog" && typeof g.order==="number" && g.order<m) m=g.order; }); return m;

  function update(id, patch){

  function swap(id, dir){
    var bl = list().filter(function(g){ return g.status==="backlog"; })
      .sort(function(a,b){ return (a.order==null?1e9:a.order)-(b.order==null?1e9:b.order); });
    var idx=-1; for(var i=0;i<bl.length;i++){ if(bl[i].id===id){ idx=i; break; } }
    var j=idx+dir; if(idx<0||j<0||j>=bl.length) return;
    var a=byId(bl[idx].id), b=byId(bl[j].id);
    var ao=(a.order==null?idx:a.order), bo=(b.order==null?j:b.order);
    if(ao===bo){ bo = ao + dir; }
    a.order=bo; b.order=ao; markDirty(); render();
  }

  function buildJson(){
    var games = S.games.map(function(g){
      return { id:g.id, name:g.name, steamId:g.steamId||null, image:g.image||null, status:g.status, tags:g.tags||[], order:(typeof g.order==="number"?g.order:0),
        addedAt:g.addedAt||null, finishedAt:g.finishedAt||null, rating:(g.rating==null?null:g.rating), notes:g.notes||"" };
    });
    return JSON.stringify({ subtitle:(S.meta&&S.meta.subtitle)||"", hiddenRecos:hiddenRecos(), games:games }, null, 2) + "\n";
  }
  function tagLabels(tags){ return (tags||[]).map(function(t){ return TAGS[t]||t; }).join(", "); }
  function starsText(n){ n=n||0; var s=""; for(var i=0;i<5;i++){ s+=(i<n?"★":"☆"); } return s; }
  function buildMarkdown(){
    var GL=list(); var playing=null, backlog=[], done=[];
    GL.forEach(function(g){ if(g.status==="playing"&&!playing) playing=g; else if(g.status==="done") done.push(g); else backlog.push(g); });
    backlog.sort(function(a,b){ return (a.order==null?1e9:a.order)-(b.order==null?1e9:b.order); });
    done.sort(function(a,b){ return String(b.finishedAt||"").localeCompare(String(a.finishedAt||"")); });
    var L=["# Nos Arcs"]; var sub=(S.meta&&S.meta.subtitle)||"";
    if(sub) L.push("", "_"+sub+"_");
    L.push("", "## Arc en cours");
    L.push(playing ? ("- **"+playing.name+"** — "+tagLabels(playing.tags)) : "- _(aucun)_");
    L.push("", "## La suite");
    if(backlog.length) backlog.forEach(function(g,i){ L.push((i+1)+". **"+g.name+"** — "+tagLabels(g.tags)); });
    else L.push("- _(vide)_");
    L.push("", "## Chapitres bouclés");
    if(done.length) done.forEach(function(g){
      var bits=[]; if(g.finishedAt) bits.push(fmtDate(g.finishedAt)); if(g.rating) bits.push(starsText(g.rating));
      var line="- **"+g.name+"**"+(bits.length?" — "+bits.join(" · "):"");
      if(g.notes) line+=" — « "+String(g.notes).replace(/\s+/g," ")+" »";
      L.push(line);
    }); else L.push("- _(rien encore)_");
    L.push(""); return L.join("\n");
  }

  // ---------- synchro directe GitHub (API Contents + token perso) ----------
  var ghModalEl=null;
  var TOKEN_KEY="nosarcs.ghToken";
  var SYNC={ sha:null, timer:null, busy:false, again:false, status:"idle", err:"", hideT:null };
  function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||""; }catch(e){ return ""; } }
  function setToken(t){ try{ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }
  function repoOk(){ var r=window.REPO||{}; return !!(r.owner&&r.name); }
  function branch(){ return (window.REPO&&window.REPO.branch)||"main"; }
  function apiUrl(){ var r=window.REPO||{}; return "https://api.github.com/repos/"+r.owner+"/"+r.name+"/contents/"+dataFile(); }
  function ghHeaders(){ return { "Authorization":"Bearer "+getToken(), "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" }; }
  function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
  function b64dec(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g,"")))); }

  function ghGet(){
    return fetch(apiUrl()+"?ref="+encodeURIComponent(branch())+"&t="+Date.now(), { headers:ghHeaders(), cache:"no-store" })
      .then(function(r){
        if(r.status===404) return { sha:null, data:null };
        if(!r.ok) throw new Error(r.status===401?"token invalide ou expiré":"HTTP "+r.status);
        return r.json().then(function(j){ return { sha:j.sha, data:JSON.parse(b64dec(j.content)) }; });
      });
  }
  function ghPut(text){
    var body={ message:"Carnet : mise à jour", content:b64enc(text), branch:branch() };
    if(SYNC.sha) body.sha=SYNC.sha;
    return fetch(apiUrl(), { method:"PUT", headers:ghHeaders(), body:JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok:r.ok, status:r.status, j:j }; }); });
  }
  function putOrThrow(text){
    return ghPut(text).then(function(res){
      if(res.ok){ SYNC.sha=res.j.content.sha; return; }
      if(res.status===409 || res.status===422){
        // sha périmé (fichier modifié ailleurs) : on reprend le sha courant et on réécrit
        return ghGet().then(function(x){ SYNC.sha=x.sha; return ghPut(text); }).then(function(r2){
          if(!r2.ok) throw new Error((r2.j&&r2.j.message)||"HTTP "+r2.status);
          SYNC.sha=r2.j.content.sha;
        });
      }
      if(res.status===401) throw new Error("token invalide ou expiré");
      if(res.status===403 || res.status===404) throw new Error("le token n'a pas accès en écriture au dépôt");
      throw new Error((res.j&&res.j.message)||"HTTP "+res.status);
    });
  }
  function setSync(st, err){
    SYNC.status=st; SYNC.err=err||""; clearTimeout(SYNC.hideT);
    if(st==="saved") SYNC.hideT=setTimeout(function(){ if(SYNC.status==="saved"){ SYNC.status="idle"; renderSaveBar(); } }, 1800);
    renderSaveBar();
  }
  function scheduleSync(){
    if(!getToken() || !repoOk() || S.phase!=="ready") return;
    clearTimeout(SYNC.timer); setSync("pending");
    SYNC.timer=setTimeout(pushNow, 900);
  }
  function pushNow(){
    if(SYNC.busy){ SYNC.again=true; return; }
    SYNC.busy=true; setSync("saving");
    var text=buildJson();
    putOrThrow(text).then(function(){
      SYNC.busy=false;
      if(SYNC.again){ SYNC.again=false; pushNow(); return; }
      if(buildJson()===text){ S.dirty=false; setBaseline(); }
      setSync("saved");
    }, function(e){
      SYNC.busy=false; SYNC.again=false;
      setSync("error", e && e.message || "erreur réseau");
    });
  }
  // récupère les modifs de l'autre joueur (sans écraser ce qui est en cours d'édition)
  function pullRemote(){
    if(!getToken() || !repoOk() || S.phase!=="ready" || S.dirty || SYNC.busy) return;
    if(document.hidden || S.ui.addOpen || S.ui.noteFor || document.activeElement===subEl) return;
    ghGet().then(function(x){
      if(!x.data || x.sha===SYNC.sha || S.dirty || SYNC.busy) return;
      SYNC.sha=x.sha; applyData(x.data); setBaseline(); render();
      toast("Carnet mis à jour depuis GitHub.");
    }, function(){});
  }
  setInterval(pullRemote, 20000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) pullRemote(); });

  function renderGhModal(){
    var on=!!getToken();
    ghModalEl.innerHTML=
      '<div class="sm-backdrop" data-action="gh-close"></div>'+
      '<div class="sm-card" role="dialog" aria-modal="true" aria-labelledby="gh-title">'+
        '<div class="sm-head"><h3 id="gh-title">Enregistrement automatique</h3>'+
          '<button class="iconbtn" data-action="gh-close" aria-label="Fermer">'+IC.x+'</button></div>'+
        '<p class="sm-intro">'+(on
          ? '<b>Connecté.</b> Chaque modification est commitée directement dans <code>'+esc(dataFile())+'</code>.'
          : 'Colle un <b>token GitHub</b> pour que chaque modification soit commitée directement dans <code>'+esc(dataFile())+'</code>, sans copier-coller.')+
        '</p>'+
        '<ol class="gh-steps">'+
          '<li>Ouvre <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Fine-grained token</a>.</li>'+
          '<li><i>Repository access</i> : <b>Only select repositories</b> → <code>'+esc((window.REPO||{}).name||"")+'</code>.</li>'+
          '<li><i>Permissions → Contents</i> : <b>Read and write</b>. Génère, copie.</li>'+
        '</ol>'+
        '<input id="gh-token" class="gh-input" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" value="">'+
        '<p class="gh-note">Le token reste uniquement dans ce navigateur (localStorage), jamais dans le dépôt. Ne le partage pas publiquement.</p>'+
        '<div class="sm-actions">'+
          '<button class="btn primary sm" data-action="gh-save">'+(on?'Remplacer le token':'Connecter')+'</button>'+
          (on?'<button class="btn ghost sm" data-action="gh-logout">Déconnecter</button>':'')+
          '<span class="sm-spacer"></span>'+
          '<button class="btn ghost sm" data-action="gh-close">Fermer</button>'+
        '</div>'+
      '</div>';
  }
  // ---------- image perso d'un jeu (URL, Steam ou fichier envoyé dans covers/) ----------
  var coverModalEl=null, CV={ id:null, busy:false };
  function rawUrl(path){ var r=window.REPO||{}; return "https://raw.githubusercontent.com/"+r.owner+"/"+r.name+"/"+branch()+"/"+path; }
  function renderCoverModal(){
    var g=byId(CV.id); if(!g) return;
    var cur = g.image || (g.steamId ? "https://store.steampowered.com/app/"+g.steamId+"/" : "");
    var canUpload = !!getToken() && repoOk();
    coverModalEl.innerHTML=
      '<div class="sm-backdrop" data-action="cv-close"></div>'+
      '<div class="sm-card" role="dialog" aria-modal="true" aria-labelledby="cv-title">'+
        '<div class="sm-head"><h3 id="cv-title">Image — '+esc(g.name)+'</h3>'+
          '<button class="iconbtn" data-action="cv-close" aria-label="Fermer">'+IC.x+'</button></div>'+
        '<div class="cv-preview">'+coverHtml({ name:g.name, image:g.image, steamId:g.steamId },"p")+'</div>'+
        '<input id="cv-url" class="gh-input" type="text" autocomplete="off" spellcheck="false" value="'+esc(cur)+'" '+
          'placeholder="Lien Steam, ID Steam, ou URL d\'une image (clic droit → copier l\'adresse de l\'image)">'+
        (canUpload
          ? '<div class="cv-drop" id="cv-drop">'+(CV.busy ? 'Envoi de l\'image…'
              : 'Glisse une image ici, colle-la (Ctrl+V) ou <label>choisis un fichier<input id="cv-file" type="file" accept="image/*"></label>')+'</div>'
          : '<p class="gh-note">Pour envoyer un fichier ou une capture, <button class="linkbtn" data-action="gh-open">active l\'enregistrement automatique</button>. Sinon, une URL d\'image suffit.</p>')+
        '<div class="sm-actions">'+
          '<button class="btn primary sm" data-action="cv-save">Enregistrer</button>'+
          '<button class="btn ghost sm" data-action="cv-clear">Retirer l\'image</button>'+
          '<span class="sm-spacer"></span>'+
          '<button class="btn ghost sm" data-action="cv-close">Fermer</button>'+
        '</div>'+
      '</div>';
  }
  function closeCover(){ CV.id=null; if(coverModalEl) coverModalEl.hidden=true; }
  function setCover(id, patch){ closeCover(); update(id, patch); }
  function resizeImage(file){
    return new Promise(function(res, rej){
      var url=URL.createObjectURL(file), im=new Image();
      im.onload=function(){
        var W=920, H=430, c=document.createElement("canvas"); c.width=W; c.height=H;
        var x=c.getContext("2d"), r=Math.max(W/im.width, H/im.height), w=im.width*r, h=im.height*r;
        x.fillStyle="#000"; x.fillRect(0,0,W,H); x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.85));
      };
      im.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("image illisible")); };
      im.src=url;
    });
  }
  function uploadCover(file){
    var id=CV.id, g=byId(id);
    if(!g || CV.busy || !file) return;
    if(!/^image\//.test(file.type||"")){ toast("Ce fichier n'est pas une image."); return; }
    if(!getToken() || !repoOk()){ A["gh-open"](); return; }
    CV.busy=true; renderCoverModal();
    var path="covers/"+String(id).replace(/[^a-z0-9-]/gi,"")+"-"+Date.now().toString(36)+".jpg";
    resizeImage(file).then(function(dataUrl){
      var r=window.REPO;
      return fetch("https://api.github.com/repos/"+r.owner+"/"+r.name+"/contents/"+path, {
        method:"PUT", headers:ghHeaders(),
        body:JSON.stringify({ message:"Carnet : image de "+g.name, content:dataUrl.split(",")[1], branch:branch() })
      }).then(function(res){
        if(!res.ok) throw new Error(res.status===401?"token invalide ou expiré":"HTTP "+res.status);
        var url=rawUrl(path); LOCAL_COVER[url]=dataUrl;
        CV.busy=false; setCover(id, { image:url });
        toast("Image enregistrée.");
      });
    }).catch(function(e){
      CV.busy=false; if(CV.id) renderCoverModal();
      toast("Envoi impossible : "+(e&&e.message||"erreur"));
    });
  }
  A["cover-edit"]=function(id){
    if(!coverModalEl){ coverModalEl=document.createElement("div"); coverModalEl.id="covermodal"; coverModalEl.hidden=true; document.body.appendChild(coverModalEl); }
    CV.id=id; renderCoverModal(); coverModalEl.hidden=false;
    var i=document.getElementById("cv-url"); if(i){ i.focus(); i.select(); }
  };
  A["cv-close"]=function(){ closeCover(); };
  A["cv-clear"]=function(){ if(CV.id) setCover(CV.id, { image:null, steamId:null }); };
  A["cv-save"]=function(){
    var i=document.getElementById("cv-url"); var v=i ? i.value.trim() : "";
    if(!CV.id) return;
    if(!v){ setCover(CV.id, { image:null, steamId:null }); return; }
    var sid=parseSteamId(v);
    if(sid){ setCover(CV.id, { steamId:sid, image:null }); return; }
    if(isImgUrl(v)){ setCover(CV.id, { image:v }); return; }
    toast("Colle un lien Steam, un ID Steam ou une URL d'image (https://…).");
  };
  document.addEventListener("change", function(ev){
    if(ev.target && ev.target.id==="cv-file" && ev.target.files && ev.target.files[0]) uploadCover(ev.target.files[0]);
  });
  document.addEventListener("paste", function(ev){
    if(!CV.id || !ev.clipboardData) return;
    var items=ev.clipboardData.items||[];
    for(var i=0;i<items.length;i++){
      if(items[i].kind==="file" && /^image\//.test(items[i].type)){ ev.preventDefault(); uploadCover(items[i].getAsFile()); return; }
    }
  });
  ["dragover","dragleave","drop"].forEach(function(t){
    document.addEventListener(t, function(ev){
      var d=ev.target && ev.target.closest && ev.target.closest("#cv-drop");
      if(!d) return;
      ev.preventDefault();
      d.classList.toggle("over", t==="dragover");
      if(t==="drop" && ev.dataTransfer && ev.dataTransfer.files[0]) uploadCover(ev.dataTransfer.files[0]);
    });
  });

  function updateFoot(){
    var foot=document.getElementById("footnote"); if(!foot) return;
    foot.innerHTML = getToken()
      ? 'Enregistrement automatique sur GitHub activé · <button class="linkbtn" data-action="gh-open">Réglages</button>'
      : 'Vos données vivent dans games.json (versionné sur GitHub) · <button class="linkbtn" data-action="gh-open">Activer l\'enregistrement automatique</button>';
  }
  A["gh-open"]=function(){ renderGhModal(); ghModalEl.hidden=false; var i=document.getElementById("gh-token"); if(i) i.focus(); };
  A["gh-close"]=function(){ ghModalEl.hidden=true; };
  A["gh-retry"]=function(){ pushNow(); };
  A["gh-logout"]=function(){ setToken(""); SYNC.status="idle"; ghModalEl.hidden=true; updateFoot(); renderSaveBar(); toast("Déconnecté de GitHub."); };
  A["gh-save"]=function(){
    var i=document.getElementById("gh-token"); var t=i ? i.value.trim() : "";
    if(!t){ toast("Colle le token d'abord."); return; }
    var prev=getToken(); setToken(t);
    ghGet().then(function(x){
      ghModalEl.hidden=true; updateFoot(); SYNC.sha=x.sha;
      if(S.dirty || !x.data){ pushNow(); }            // modifs locales en attente → on les pousse
      else { applyData(x.data); setBaseline(); render(); setSync("idle"); }
      toast("Connecté : enregistrement automatique activé.");
    }, function(e){
      setToken(prev);
      toast("Connexion refusée : "+(e&&e.message||"erreur"));
    });
  };

  // ---------- chargement des données ----------
  function normGame(g){
    return { id:g.id||newId(), name:g.name||"Sans nom", steamId:parseSteamId(g.steamId), image:(typeof g.image==="string" && /^(https?:\/\/|covers\/[\w.-]+$)/i.test(g.image))?g.image:null, status:(g.status==="playing"||g.status==="done")?g.status:"backlog",
      tags:Array.isArray(g.tags)?g.tags:[], order:(typeof g.order==="number"?g.order:0),
      addedAt:g.addedAt||null, finishedAt:g.finishedAt||null, rating:(g.rating==null?null:g.rating), notes:g.notes||"" };
  }
  function applyData(data){
    var arr=(data&&Array.isArray(data.games))?data.games:[];
    S.games = arr.map(normGame);
    S.meta = { subtitle:(data&&data.subtitle)||SEED_SUBTITLE,
      hiddenRecos:(data&&Array.isArray(data.hiddenRecos))?data.hiddenRecos.filter(function(n){ return typeof n==="string"; }):[] };
    if(document.activeElement!==subEl) subEl.textContent = S.meta.subtitle;
  }
  function applySeed(){
    S.games = SEED.map(function(s){ return { id:s.id, name:s.name, image:s.image||null, status:s.status, tags:s.tags, order:s.order,
      addedAt:now(), finishedAt:null, rating:null, notes:"" }; });
    S.meta = { subtitle:SEED_SUBTITLE, hiddenRecos:[] }; subEl.textContent = SEED_SUBTITLE;
  }
  function loadData(){
    if(getToken() && repoOk()){
      ghGet().then(function(x){
        SYNC.sha=x.sha; S.phase="ready";
        if(x.data){ applyData(x.data); setBaseline(); render(); renderSaveBar(); }
        else { applySeed(); setBaseline(); render(); markDirty(); } // fichier absent → on le crée
      }, function(e){
        loadPages();
        setSync("error", e && e.message || "erreur réseau");
      });
      return;
    }
    loadPages();
  }
  function loadPages(){
    var url=dataFile()+"?v="+Date.now();
    fetch(url, {cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(data){ applyData(data); S.phase="ready"; setBaseline(); render(); })
      .catch(function(){
        // games.json absent (tout 1er déploiement) ou ouverture en local → contenu de départ
        applySeed(); S.phase="ready"; setBaseline(); S.dirty=true; renderSaveBar(); render();
      });
  }

  // ---------- boot ----------
  function boot(){
    initSaveUI();
    updateFoot();
    loadData();
  }

  boot();
})();
</script>
</body>
</html>
